<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — METRA AI</title>
  <meta name="description" content="Создай аккаунт METRA AI: триал бесплатно, без карты, запуск за 10 минут.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 3 3 7.5zM10 13.5 21 3"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
</svg>

<header class="auth-top">
  <span class="logo" aria-label="METRA AI"><img class="logo__img" src="img/logo.png" alt="metra ai" height="26"></span>
  <div class="auth-top__right">
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>

<main class="auth">
  <!-- form side -->
  <section class="auth__form-side">
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <span class="auth-tabs__pill" aria-hidden="true"></span>
        <button type="button" role="tab" data-tab="signup" data-t="tabSignup">Регистрация</button>
        <button type="button" role="tab" data-tab="login" data-t="tabLogin">Вход</button>
      </div>

      <h1 class="auth-title"><span class="chrome" data-t="titleSignup">Создай аккаунт</span></h1>

      <a href="#" class="google-login" id="googleLogin">
        <svg class="google-login__g" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span data-t="google">Продолжить с Google</span>
      </a>

      <div class="auth-or"><span data-t="or">или по почте</span></div>

      <form class="auth-form" id="authForm" novalidate>
        <div class="role-x" data-only="signup" role="radiogroup" aria-labelledby="roleLabel">
          <span class="role-x__label" id="roleLabel" data-t="roleQ">Кто создаёт аккаунт?</span>
          <div class="role-x__opts">
            <label><input type="radio" name="role" value="owner" checked><span data-t="roleOwner">Владелец</span></label>
            <label><input type="radio" name="role" value="employee"><span data-t="roleEmployee">Сотрудник</span></label>
          </div>
        </div>

        <label class="field-x" data-only="signup">
          <span class="field-x__label" data-t="nick">Никнейм</span>
          <span class="field-x__box">
            <svg class="ic"><use href="#i-user"/></svg>
            <input type="text" name="nickname" autocomplete="nickname" maxlength="40" data-ph="nickPh" placeholder="Ваше имя">
          </span>
          <span class="field-x__err" data-t="errNick">Введи никнейм</span>
        </label>

        <label class="field-x">
          <span class="field-x__label" data-t="email">Email</span>
          <span class="field-x__box">
            <svg class="ic"><use href="#i-mail"/></svg>
            <input type="email" name="email" autocomplete="email" placeholder="you@mail.com" required>
          </span>
          <span class="field-x__err" data-t="errEmail">Введи корректный email</span>
        </label>

        <label class="field-x">
          <span class="field-x__label" data-t="password">Пароль</span>
          <span class="field-x__box">
            <svg class="ic"><use href="#i-lock"/></svg>
            <input type="password" name="password" autocomplete="new-password" maxlength="72" data-ph="passPh" placeholder="8–72 символа: A-z, 0-9" required>
            <button type="button" class="field-x__eye" aria-label="Показать пароль"><svg class="ic"><use href="#i-eye"/></svg></button>
          </span>
          <span class="field-x__err" data-t="errPass">8–72 символа: только латиница и цифры</span>
        </label>

        <label class="field-x" data-only="signup">
          <span class="field-x__label" data-t="password2">Повторите пароль</span>
          <span class="field-x__box">
            <svg class="ic"><use href="#i-lock"/></svg>
            <input type="password" name="password2" autocomplete="new-password" maxlength="72" data-ph="pass2Ph" placeholder="Повторите пароль">
            <button type="button" class="field-x__eye" aria-label="Показать пароль"><svg class="ic"><use href="#i-eye"/></svg></button>
          </span>
          <span class="field-x__err" data-t="errPass2">Пароли не совпадают</span>
        </label>

        <label class="check-x" data-only="signup">
          <input type="checkbox" name="terms" required>
          <span class="check-x__box"><svg class="ic"><use href="#i-check"/></svg></span>
          <span class="check-x__text" data-t="terms">Принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a></span>
        </label>

        <div class="auth-row" data-only="login">
          <label class="check-x check-x--sm">
            <input type="checkbox" name="remember" value="1" checked>
            <span class="check-x__box"><svg class="ic"><use href="#i-check"/></svg></span>
            <span class="check-x__text" data-t="remember">Запомнить меня</span>
          </label>
          <a href="#" class="auth-forgot" data-t="forgot">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--lg btn--block auth-submit" data-t="submitSignup">Создать аккаунт</button>
      </form>

      <p class="auth-switch">
        <span data-t="switchToLoginQ">Уже есть аккаунт?</span>
        <button type="button" class="auth-switch__btn" data-t="switchToLogin">Войти</button>
      </p>
    </div>
  </section>

  <!-- brand side -->
  <section class="auth__art-side" aria-hidden="true">
    <div class="auth-art">
      <span class="plaque plaque--y auth-art__plaque" data-t="plaque">Триал бесплатно</span>
      <h2 class="auth-art__title"><span class="chrome" data-t="artTitle">Канал и лиды<br><span class="accent">на автопилоте</span></span></h2>
      <ul class="auth-art__list">
        <li data-t="p1">AI пишет посты и публикует по расписанию</li>
        <li data-t="p2">Готовый контент-план под вертикаль</li>
        <li data-t="p3">AI ведёт диалоги с лидами голосом и текстом</li>
      </ul>
      <div class="mascot auth-art__mascot">[ Маскот ]</div>
    </div>
  </section>
</main>

<script src="register.js"></script>
</body>
</html>
